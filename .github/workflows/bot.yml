name: divar-bot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_post:
        description: "Post one ad to the channel as a test"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: divar-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load database
        id: load
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git show origin/data:ads.db > ads.db
            echo "loaded database: $(stat -c%s ads.db) bytes"
          else
            echo "no data branch yet: starting a new database"
          fi
      - name: Install chart library
        run: pip install --quiet matplotlib
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FORCE_POST_ONE: ${{ inputs.test_post && '1' || '' }}
        run: python3 main.py
      - name: Save database
        if: always() && steps.load.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f ads.db ] || exit 0
          mkdir -p /tmp/data && cp ads.db /tmp/data/ && cd /tmp/data
          git init -q -b data
          git config user.name "divar-bot"
          git config user.email "divar-bot@users.noreply.github.com"
          git add ads.db
          git commit -qm "database $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
